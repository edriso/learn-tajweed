name: Deploy to GitHub Pages

# Works in a fork with no configuration. The address is worked out from the
# repository name, and the `mirror` job below is skipped unless you have asked
# for it. Nothing here needs editing to make your own copy deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Never cancel a run that is already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the pre-render step derives each page's <lastmod>
          # from the last commit that touched its Markdown file. A shallow
          # clone would date every lesson to the same day, and an inaccurate
          # lastmod is worse than none.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Optional. Set these in Settings -> Secrets and variables -> Actions ->
      # Variables only if you publish at a second address, such as a custom
      # domain. Leave them unset and everything below still works.
      #
      #   MIRROR_REPO  owner/repo to publish the second copy to, e.g. edriso/dartajweed
      #   SITE_URL     the address that copy is served at, e.g. https://example.com/
      - name: Work out the addresses to build for
        env:
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
          MIRROR_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY#*/}
          owner=$(echo "$owner" | tr '[:upper:]' '[:lower:]')
          # A repository named <owner>.github.io is served at the host root.
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            own="https://$owner.github.io/"
          else
            own="https://$owner.github.io/$repo/"
          fi
          echo "OWN_SITE_URL=$own" >> "$GITHUB_ENV"

          if [ -n "$MIRROR_REPO" ] && [ -z "$MIRROR_SITE_URL" ]; then
            echo "::error::MIRROR_REPO is set but the SITE_URL variable is not." \
                 "Set SITE_URL to the address the mirror is served at, e.g. https://example.com/"
            exit 1
          fi

          # Both copies claim the same address so they never compete in search.
          # With no mirror configured this is empty, and each build claims itself.
          echo "CANONICAL=${MIRROR_SITE_URL}" >> "$GITHUB_ENV"
          echo "Own Pages address : $own"
          echo "Mirror address    : ${MIRROR_SITE_URL:-(none)}"

      # Verification lives in the build itself: any mismatch between a lesson
      # and the mushaf fails here, before any address is touched.
      - name: Build this repository's own Pages site
        env:
          SITE_URL: ${{ env.OWN_SITE_URL }}
          SITE_CANONICAL: ${{ env.CANONICAL }}
        run: npm run build

      - run: npm run lint

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Build the second copy
        if: ${{ vars.MIRROR_REPO != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          mv dist dist-mirror

          # The mirror publishes from a branch, and branch-based Pages *does*
          # read CNAME, unlike actions/deploy-pages above which ignores it.
          # Every push to the mirror replaces it wholesale, so without this file
          # the custom domain would be dropped on the next deploy.
          echo "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##' > dist-mirror/CNAME

          # Branch-based Pages runs the build through Jekyll, which ignores any
          # file or folder whose name starts with an underscore. Nothing is
          # named that way today, and .nojekyll means nothing ever has to be:
          # it turns Jekyll off rather than relying on that staying true.
          touch dist-mirror/.nojekyll

      - uses: actions/upload-artifact@v4
        if: ${{ vars.MIRROR_REPO != '' }}
        with:
          name: dist-mirror
          path: dist-mirror
          # .nojekyll is hidden, and v4 drops hidden files by default.
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publishes a second copy to another repository, which holds no source — only
  # the built site, replaced wholesale each deploy.
  #
  # Skipped entirely unless MIRROR_REPO is set, so a fork never sees it fail.
  # The condition has to read `vars` rather than `secrets`, because the secrets
  # context is not available in a job-level `if`.
  mirror:
    needs: build
    if: ${{ vars.MIRROR_REPO != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-mirror
          path: dist-mirror

      - name: Push the built site to the mirror repository
        env:
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
          # An SSH deploy key with write access to that one repository. A
          # personal access token would carry the whole account instead.
          DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::MIRROR_REPO is set but the MIRROR_DEPLOY_KEY secret is missing." \
                 "Add the private half of a deploy key that can write to $MIRROR_REPO."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes'

          # A fresh single-commit history every time, force-pushed. The mirror
          # is output, not source: there is no history there worth keeping, and
          # this stops the repository growing without bound.
          cd dist-mirror
          git init -q -b main
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Built from ${GITHUB_SHA}"
          git push -f "git@github.com:${MIRROR_REPO}.git" main
