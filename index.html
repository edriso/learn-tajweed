<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      SVG first for browsers that take it; a PNG beside it because Google's
      favicon documentation does not list SVG among the formats it states
      support for, and the icon next to an Arabic search result matters.
      apple-touch-icon stops iOS screenshotting the page on "add to home
      screen". All are generated from favicon.svg by `npm run og`.
    -->
    <link rel="icon" type="image/svg+xml" href="/learn-tajweed/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/learn-tajweed/icon-192.png" />
    <link rel="apple-touch-icon" href="/learn-tajweed/apple-touch-icon.png" />
    <link rel="manifest" href="/learn-tajweed/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      One theme-color, set from the saved theme by the script below and kept in
      step by src/hooks/useTheme.ts. Media-query variants would follow the OS
      instead, and the theme here is a choice that can disagree with it: the
      browser chrome would then sit light above a dark page. The two values are
      --color-ink-50 and --color-ink-950 from src/index.css, resolved to sRGB.
    -->
    <meta name="theme-color" content="#fbfaf7" />
    <meta
      name="description"
      content="تعلَّم أحكام التجويد برواية حفص عن عاصم خطوةً بخطوة، بلغةٍ بسيطةٍ وأمثلةٍ من القرآن الكريم. دليلٌ مجانيٌّ مرتَّبٌ من الصفر إلى إتقان التلاوة."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:site_name" content="تعلَّم التجويد" />
    <!--
      Absolute, because a link-preview crawler has no base to resolve against.
      Regenerate with `npm run og`; the verse on the card is sliced out of the
      pinned mushaf, never typed. Every pre-rendered route inherits this image.
    -->
    <meta property="og:image" content="https://edriso.github.io/learn-tajweed/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="تعلَّم التجويد · دليلٌ لأحكام تلاوة القرآن على رواية حفص عن عاصم من طريق الشاطبيّة"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="تعلَّم التجويد · دليلٌ عمليٌّ لأحكام تلاوة القرآن" />
    <meta
      property="og:description"
      content="أحكام التجويد مرتَّبةً من الأسهل إلى الأصعب، بأمثلةٍ من القرآن الكريم وتمارينَ بعد كلّ درس."
    />
    <title>تعلَّم التجويد · دليلٌ عمليٌّ لأحكام تلاوة القرآن</title>
    <script>
      // Apply the saved theme and the rule-colour choice before the first paint,
      // so there is no flash of the wrong colours. The React side reads both
      // back from here (src/hooks/useTheme.ts and src/lib/settings.ts).
      ;(function () {
        try {
          var saved = localStorage.getItem('tajweed-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = saved ? saved === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', isDark)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', isDark ? '#0a100c' : '#fbfaf7')
          var plain = localStorage.getItem('tajweed-rule-colours') === 'off'
          document.documentElement.classList.toggle('plain-rules', plain)
        } catch (e) {
          /* private browsing: fall back to the light theme with colours on */
        }
      })()
    </script>

    <!--
      The boot placeholder, styled here rather than in src/index.css so it needs
      nothing but the HTML itself. React's createRoot clears #root on mount, so
      this is only ever on screen while the JavaScript is still arriving.

      It fades in after 450ms. On a normal connection the app is up before that
      and the reader never sees it at all; a placeholder that flashes for 80ms
      is worse than none. On a slow one it replaces a blank page.
    -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #fbfaf7;
        font-family: 'Cairo Variable', system-ui, sans-serif;
        color: #5e5c56;
        opacity: 0;
        animation: boot-in 0.3s ease 0.45s forwards;
      }
      .dark .boot {
        background: #0a100c;
        color: #8b8983;
      }
      .boot-ring {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid #e7e5e0;
        border-top-color: #216342;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      .dark .boot-ring {
        border-color: #2a2f2b;
        border-top-color: #2c7f56;
      }
      .boot-text {
        font-size: 0.95rem;
        font-weight: 600;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Someone who has asked for less motion gets the words, not the spinner. */
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation: none;
          opacity: 1;
        }
        .boot-ring {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <span class="boot-ring" aria-hidden="true"></span>
        <span class="boot-text">جارٍ تحميل الدليل…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
